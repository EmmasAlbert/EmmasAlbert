# 篮球场景检测数据集配置文件
# YOLOv8训练配置

# 数据集路径配置
# 使用绝对路径或相对于此配置文件的路径
path: ./datasets/basketball  # 数据集根目录
train: images/train  # 训练集图片路径（相对于path）
val: images/val      # 验证集图片路径（相对于path）
test: images/test    # 测试集图片路径（可选）

# 类别数量
nc: 3

# 类别名称
# 0: player (球员)
# 1: basketball (篮球)
# 2: hoop (球筐/篮筐)
names:
  0: player
  1: basketball
  2: hoop

# 训练参数建议（在训练脚本中可以覆盖）
# epochs: 100      # 训练轮数
# imgsz: 640       # 输入图像大小
# batch: 16        # 批次大小
# device: 0        # GPU设备ID，使用CPU则设为'cpu'

# 数据增强参数（可选，训练脚本中已设置默认值）
# hsv_h: 0.015     # 色调增强
# hsv_s: 0.7       # 饱和度增强
# hsv_v: 0.4       # 明度增强
# degrees: 10      # 旋转角度
# translate: 0.1   # 平移比例
# scale: 0.5       # 缩放比例
# fliplr: 0.5      # 左右翻转概率
# mosaic: 1.0      # 马赛克增强
# mixup: 0.1       # 混合增强
