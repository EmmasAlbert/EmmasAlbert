# YOLOv8 篮球检测数据集配置文件
# Basketball Detection Dataset Configuration

# 数据集根目录 (相对于此文件的路径或绝对路径)
# Dataset root directory (relative to this file or absolute path)
path: ../datasets/basketball  # 数据集根目录

# 训练集、验证集、测试集的图像目录 (相对于path)
# Train/Val/Test image directories (relative to path)
train: images/train  # 训练集图像目录
val: images/val      # 验证集图像目录
test: images/test    # 测试集图像目录（可选）

# 类别数量
# Number of classes
nc: 3

# 类别名称列表（顺序必须与标注文件中的类别ID对应）
# Class names (must match the order of class IDs in annotations)
names:
  0: player      # 球员
  1: basketball  # 篮球
  2: hoop        # 球筐

# 可选：数据集元信息
# Optional: Dataset metadata
dataset_name: Basketball Detection Dataset
version: 1.0
description: 用于检测篮球比赛中的球员、篮球和球筐
author: EmmasAlbert
date: 2024-01-31
