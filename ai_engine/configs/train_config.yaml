# YOLOv8 训练超参数配置
# YOLOv8 Training Hyperparameters Configuration

# 基础训练参数
# Basic training parameters
epochs: 100          # 训练轮数
batch: 16            # 批次大小 (根据GPU内存调整: -1=自动, 8/16/32)
imgsz: 640           # 输入图像大小
device: 0            # 训练设备 (0=GPU0, cpu, 0,1,2,3 for multi-GPU)
workers: 8           # 数据加载线程数
project: runs/train  # 项目保存路径
name: basketball     # 实验名称

# 模型配置
# Model configuration
model: yolov8n.pt    # 预训练模型 (n/s/m/l/x)
pretrained: True     # 是否使用预训练权重

# 优化器参数
# Optimizer parameters
optimizer: SGD       # 优化器类型 (SGD, Adam, AdamW)
lr0: 0.01           # 初始学习率
lrf: 0.01           # 最终学习率 (lr0 * lrf)
momentum: 0.937     # SGD momentum / Adam beta1
weight_decay: 0.0005 # 权重衰减
warmup_epochs: 3.0  # 学习率预热轮数
warmup_momentum: 0.8 # 预热初始momentum
warmup_bias_lr: 0.1 # 预热初始bias学习率

# 损失函数权重
# Loss weights
box: 7.5            # 边界框损失权重
cls: 0.5            # 分类损失权重
dfl: 1.5            # 分布焦点损失权重

# 数据增强参数
# Data augmentation parameters
hsv_h: 0.015        # HSV色调增强 (fraction)
hsv_s: 0.7          # HSV饱和度增强 (fraction)
hsv_v: 0.4          # HSV明度增强 (fraction)
degrees: 0.0        # 旋转角度 (+/- deg)
translate: 0.1      # 平移 (+/- fraction)
scale: 0.5          # 缩放增益 (+/- gain)
shear: 0.0          # 剪切角度 (+/- deg)
perspective: 0.0    # 透视变换 (+/- fraction)
flipud: 0.0         # 上下翻转概率
fliplr: 0.5         # 左右翻转概率
mosaic: 1.0         # 马赛克增强概率
mixup: 0.0          # Mixup增强概率
copy_paste: 0.0     # 复制粘贴增强概率

# 训练策略
# Training strategy
patience: 50        # 早停耐心值 (epochs without improvement)
save_period: 10     # 模型保存周期 (每N个epoch保存一次)
seed: 0             # 随机种子
deterministic: True # 是否使用确定性训练
single_cls: False   # 是否将所有类别视为单一类别
rect: False         # 是否使用矩形训练
cos_lr: False       # 是否使用余弦学习率调度
close_mosaic: 10    # 最后N个epoch禁用mosaic增强
amp: True           # 自动混合精度训练
fraction: 1.0       # 使用数据集的比例 (0.0-1.0)

# 验证参数
# Validation parameters
val: True           # 是否在训练期间验证
plots: True         # 是否保存训练图表
save: True          # 是否保存训练检查点
save_json: False    # 是否保存结果为JSON
save_hybrid: False  # 是否保存混合版本标签
conf: 0.001         # 目标置信度阈值
iou: 0.7            # NMS IoU阈值
max_det: 300        # 每张图像的最大检测数

# 回调和日志
# Callbacks and logging
verbose: True       # 详细输出
