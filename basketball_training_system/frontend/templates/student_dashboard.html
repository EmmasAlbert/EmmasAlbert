<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的训练 - 篮球训练辅助系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard-card h3 {
            margin: 0 0 1rem 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-card .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .training-plan {
            margin-top: 1rem;
        }
        
        .plan-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        
        .plan-item input[type="checkbox"] {
            margin-right: 1rem;
            transform: scale(1.3);
        }
        
        .plan-item.completed {
            background: #d4edda;
            text-decoration: line-through;
            color: #6c757d;
        }
        
        .plan-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .teacher-feedback {
            background: #fff3cd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .teacher-feedback h4 {
            margin: 0 0 0.5rem 0;
            color: #856404;
        }
        
        .recent-sessions {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        
        .session-item:last-child {
            border-bottom: none;
        }
        
        .session-date {
            font-weight: 500;
        }
        
        .session-score {
            font-size: 1.2rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .profile-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .profile-section h2 {
            margin: 0 0 0.5rem 0;
        }
        
        .profile-info {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .profile-info span {
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .add-plan-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .add-plan-form input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🏀</span>
            <span class="brand-text">篮球训练辅助系统</span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/" class="nav-link">首页</a>
            <a href="/student" class="nav-link active">我的训练</a>
            <a href="/analysis" class="nav-link">视频分析</a>
            <a href="/realtime" class="nav-link">实时检测</a>
            <a href="/history" class="nav-link">训练记录</a>
            <a href="#" class="nav-link" id="logoutBtn">登出</a>
        </div>
    </nav>

    <main class="container">
        <!-- 个人信息区域 -->
        <section class="profile-section" id="profileSection">
            <h2>👨‍🎓 <span id="studentName">学生</span></h2>
            <div class="profile-info">
                <span>🏫 <span id="studentSchool">未设置学校</span></span>
                <span>📚 <span id="studentGrade">未设置年级</span></span>
                <span>👥 <span id="studentClass">未设置班级</span></span>
                <span>🆔 <span id="studentId">未设置学号</span></span>
            </div>
            <button class="btn btn-secondary" style="margin-top: 1rem;" onclick="window.location.href='/student/profile'">
                编辑个人信息
            </button>
        </section>

        <!-- 统计概览 -->
        <section class="stats-overview">
            <div class="stat-card">
                <div class="stat-icon">🏀</div>
                <div class="stat-number" id="totalSessions">0</div>
                <div class="stat-label">训练次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-number" id="avgScore">0%</div>
                <div class="stat-label">平均评分</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-number" id="progressTrend">--</div>
                <div class="stat-label">进步趋势</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="completedPlans">0</div>
                <div class="stat-label">完成计划</div>
            </div>
        </section>

        <div class="dashboard-grid">
            <div class="main-content">
                <!-- 训练计划 -->
                <div class="dashboard-card">
                    <h3>📋 我的训练计划</h3>
                    <div class="training-plan" id="trainingPlan">
                        <p style="color: #6c757d;">暂无训练计划</p>
                    </div>
                    <form class="add-plan-form" id="addPlanForm">
                        <input type="text" placeholder="添加新的训练计划..." id="newPlanInput" required>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
                
                <!-- 教师反馈 -->
                <div class="dashboard-card" style="margin-top: 1rem;">
                    <h3>💬 教师反馈</h3>
                    <div id="teacherFeedback">
                        <p style="color: #6c757d;">暂无教师反馈</p>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <!-- 最近训练记录 -->
                <div class="dashboard-card">
                    <h3>📅 最近训练</h3>
                    <div class="recent-sessions" id="recentSessions">
                        <p style="color: #6c757d;">暂无训练记录</p>
                    </div>
                    <a href="/history" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; text-align: center;">
                        查看全部记录
                    </a>
                </div>
                
                <!-- 快速操作 -->
                <div class="dashboard-card" style="margin-top: 1rem;">
                    <h3>🚀 快速操作</h3>
                    <a href="/analysis" class="btn btn-primary" style="width: 100%; margin-bottom: 0.5rem; text-align: center;">
                        上传训练视频
                    </a>
                    <a href="/realtime" class="btn btn-secondary" style="width: 100%; text-align: center;">
                        开始实时检测
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2024 篮球训练辅助系统 - 中小学生篮球训练平台</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let currentUser = null;
        let trainingPlans = [];
        
        // 检查登录状态
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const result = await response.json();
                
                if (!result.authenticated) {
                    window.location.href = '/login';
                    return null;
                }
                
                if (result.user.role !== 'student') {
                    window.location.href = '/teacher';
                    return null;
                }
                
                // 检查是否完善了个人信息
                if (!result.user.school || !result.user.class_name || !result.user.grade) {
                    if (confirm('您还未完善个人信息（学校、班级、学号等），这些信息方便教师管理和查看您的训练记录。是否现在完善？')) {
                        window.location.href = '/student/profile';
                        return null;
                    }
                }
                
                return result.user;
            } catch (e) {
                window.location.href = '/login';
                return null;
            }
        }
        
        // 更新个人信息显示
        function updateProfile(user) {
            document.getElementById('studentName').textContent = user.real_name || user.username;
            document.getElementById('studentSchool').textContent = user.school || '未设置学校';
            document.getElementById('studentGrade').textContent = user.grade || '未设置年级';
            document.getElementById('studentClass').textContent = user.class_name || '未设置班级';
            document.getElementById('studentId').textContent = user.student_id || '未设置学号';
        }
        
        // 加载训练数据
        async function loadTrainingData() {
            try {
                const response = await fetch('/api/progress');
                const result = await response.json();
                
                if (result.error) {
                    console.log('Progress not available:', result.error);
                    return;
                }
                
                document.getElementById('totalSessions').textContent = result.sessions_analyzed || 0;
                document.getElementById('avgScore').textContent = result.average_form_score 
                    ? `${(result.average_form_score * 100).toFixed(0)}%` 
                    : '0%';
                
                const trendMap = {
                    'improving': '↑ 进步',
                    'stable': '→ 稳定',
                    'declining': '↓ 下降'
                };
                document.getElementById('progressTrend').textContent = trendMap[result.trend] || '--';
            } catch (e) {
                console.log('Failed to load training data:', e);
            }
        }
        
        // 加载最近训练记录
        async function loadRecentSessions() {
            try {
                const response = await fetch('/api/sessions?limit=5');
                const result = await response.json();
                
                const container = document.getElementById('recentSessions');
                
                if (!result.sessions || result.sessions.length === 0) {
                    container.innerHTML = '<p style="color: #6c757d;">暂无训练记录，开始您的第一次训练吧！</p>';
                    return;
                }
                
                container.innerHTML = result.sessions.map(session => `
                    <div class="session-item">
                        <div>
                            <div class="session-date">${new Date(session.date).toLocaleDateString('zh-CN')}</div>
                            <div style="font-size: 0.85rem; color: #6c757d;">投篮 ${session.total_shots} 次</div>
                        </div>
                        <div class="session-score">${(session.form_quality_score * 100).toFixed(0)}%</div>
                    </div>
                `).join('');
            } catch (e) {
                console.log('Failed to load sessions:', e);
            }
        }
        
        // 加载训练计划
        async function loadTrainingPlans() {
            try {
                const response = await fetch('/api/student/plans');
                const result = await response.json();
                
                if (result.success && result.plans) {
                    trainingPlans = result.plans;
                    renderTrainingPlans();
                    updateCompletedCount();
                }
            } catch (e) {
                console.log('Failed to load plans:', e);
            }
        }
        
        // 渲染训练计划
        function renderTrainingPlans() {
            const container = document.getElementById('trainingPlan');
            
            if (trainingPlans.length === 0) {
                container.innerHTML = '<p style="color: #6c757d;">暂无训练计划，添加一个吧！</p>';
                return;
            }
            
            container.innerHTML = trainingPlans.map((plan, index) => `
                <div class="plan-item ${plan.completed ? 'completed' : ''}" data-index="${index}">
                    <input type="checkbox" ${plan.completed ? 'checked' : ''} onchange="togglePlan(${index})">
                    <span>${plan.content}</span>
                </div>
            `).join('');
        }
        
        // 切换计划完成状态
        async function togglePlan(index) {
            trainingPlans[index].completed = !trainingPlans[index].completed;
            
            try {
                await fetch('/api/student/plans', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plans: trainingPlans })
                });
            } catch (e) {
                console.log('Failed to save plans:', e);
            }
            
            renderTrainingPlans();
            updateCompletedCount();
        }
        
        // 更新完成计划数量
        function updateCompletedCount() {
            const completed = trainingPlans.filter(p => p.completed).length;
            document.getElementById('completedPlans').textContent = completed;
        }
        
        // 添加训练计划
        document.getElementById('addPlanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const input = document.getElementById('newPlanInput');
            const content = input.value.trim();
            
            if (!content) return;
            
            trainingPlans.push({
                content: content,
                completed: false,
                created_at: new Date().toISOString()
            });
            
            try {
                await fetch('/api/student/plans', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plans: trainingPlans })
                });
            } catch (e) {
                console.log('Failed to save plans:', e);
            }
            
            input.value = '';
            renderTrainingPlans();
        });
        
        // 加载教师反馈
        async function loadTeacherFeedback() {
            try {
                const response = await fetch('/api/student/feedback');
                const result = await response.json();
                
                const container = document.getElementById('teacherFeedback');
                
                if (result.success && result.feedback && result.feedback.length > 0) {
                    container.innerHTML = result.feedback.map(fb => `
                        <div class="teacher-feedback">
                            <h4>👨‍🏫 ${fb.teacher_name || '教师'}</h4>
                            <p>${fb.content}</p>
                            <small style="color: #6c757d;">${new Date(fb.created_at).toLocaleString('zh-CN')}</small>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: #6c757d;">暂无教师反馈</p>';
                }
            } catch (e) {
                console.log('Failed to load feedback:', e);
            }
        }
        
        // 登出
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {}
            
            localStorage.removeItem('session_id');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
        
        // 初始化
        (async () => {
            currentUser = await checkAuth();
            if (!currentUser) return;
            
            updateProfile(currentUser);
            await Promise.all([
                loadTrainingData(),
                loadRecentSessions(),
                loadTrainingPlans(),
                loadTeacherFeedback()
            ]);
            
            // 登出按钮
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                logout();
            });
        })();
    </script>
</body>
</html>
