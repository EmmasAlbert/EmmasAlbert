<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8篮球训练辅助系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>🏀 YOLOv8篮球训练辅助系统</h1>
            <div class="user-info">
                <span id="welcomeMsg">欢迎使用</span>
                <a href="/profile" class="nav-link" style="display:none;" id="profileLink">👤 个人资料</a>
                <a href="/teacher" class="nav-link" style="display:none;" id="teacherLink">👨‍🏫 教师控制台</a>
                <button id="logoutBtn" class="btn btn-secondary" style="display:none;">退出登录</button>
            </div>
        </header>

        <!-- 主要功能区 -->
        <div id="mainSection" class="main-section">
            <!-- 功能选项卡 -->
            <div class="function-tabs">
                <button class="func-tab-btn active" data-func="camera">📷 实时摄像头</button>
                <button class="func-tab-btn" data-func="video">📹 视频上传</button>
                <button class="func-tab-btn" data-func="history">📊 训练历史</button>
            </div>

            <!-- 摄像头模式 -->
            <div id="cameraMode" class="function-panel active">
                <h2>实时摄像头检测</h2>
                <div class="camera-container">
                    <video id="cameraVideo" autoplay playsinline></video>
                    <canvas id="cameraCanvas"></canvas>
                </div>
                <div class="control-panel">
                    <button id="startCameraBtn" class="btn btn-primary">开启摄像头</button>
                    <button id="stopCameraBtn" class="btn btn-danger" style="display:none;">关闭摄像头</button>
                </div>
                <div class="detection-info">
                    <h3>检测信息</h3>
                    <div id="cameraDetectionInfo">
                        <p>🏀 篮球: <span id="ballCount">0</span></p>
                        <p>👤 人员: <span id="personCount">0</span></p>
                        <p>🎯 篮筐: <span id="hoopCount">0</span></p>
                    </div>
                </div>
                <div class="analysis-feedback">
                    <h3>实时反馈</h3>
                    <div id="cameraFeedback" class="feedback-box">
                        等待检测...
                    </div>
                </div>
            </div>

            <!-- 视频上传模式 -->
            <div id="videoMode" class="function-panel">
                <h2>视频上传分析</h2>
                <div class="upload-container">
                    <input type="file" id="videoFileInput" accept="video/*" style="display:none;">
                    <button class="btn btn-primary" onclick="document.getElementById('videoFileInput').click()">
                        选择视频文件
                    </button>
                    <div id="videoFileName" class="file-name"></div>
                </div>
                <div class="control-panel">
                    <button id="uploadBtn" class="btn btn-success" style="display:none;">上传并分析</button>
                </div>
                <div class="progress-container" style="display:none;">
                    <div class="progress-bar">
                        <div id="uploadProgress" class="progress-fill"></div>
                    </div>
                    <p id="uploadStatus">准备上传...</p>
                </div>
                
                <!-- 视频预览和分析结果并排显示 -->
                <div id="videoAnalysisSection" class="video-analysis-section" style="display:none;">
                    <div class="video-preview-container">
                        <h3>📹 分析视频预览</h3>
                        <video id="analyzedVideo" controls class="analyzed-video">
                            您的浏览器不支持视频播放
                        </video>
                    </div>
                    <div class="real-time-stats">
                        <h3>📊 实时分析统计</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span class="stat-icon">🏀</span>
                                <span class="stat-label">投篮次数</span>
                                <span id="totalShots" class="stat-value">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-icon">✅</span>
                                <span class="stat-label">有效投篮</span>
                                <span id="validShots" class="stat-value">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-icon">⭐</span>
                                <span class="stat-label">平均得分</span>
                                <span id="avgScore" class="stat-value">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-icon">📐</span>
                                <span class="stat-label">平均肘部角度</span>
                                <span id="avgElbowAngle" class="stat-value">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="videoResults" class="results-container"></div>
            </div>

            <!-- 训练历史模式 -->
            <div id="historyMode" class="function-panel">
                <h2>训练历史</h2>
                <div class="history-container">
                    <div id="historyList" class="history-list">
                        加载中...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
