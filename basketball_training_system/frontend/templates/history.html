<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练记录 - 篮球训练辅助系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🏀</span>
            <span class="brand-text">篮球训练辅助系统</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/analysis" class="nav-link">视频分析</a>
            <a href="/realtime" class="nav-link">实时检测</a>
            <a href="/history" class="nav-link active">训练记录</a>
            <a href="/settings" class="nav-link">设置</a>
        </div>
    </nav>

    <main class="container">
        <h1>训练记录</h1>

        <section class="progress-section">
            <h2>📈 训练进度</h2>
            <div class="progress-overview" id="progressOverview">
                <div class="progress-card">
                    <div class="progress-label">分析次数</div>
                    <div class="progress-value" id="sessionsCount">-</div>
                </div>
                <div class="progress-card">
                    <div class="progress-label">总投篮次数</div>
                    <div class="progress-value" id="totalShotsAll">-</div>
                </div>
                <div class="progress-card">
                    <div class="progress-label">平均评分</div>
                    <div class="progress-value" id="avgScoreAll">-</div>
                </div>
                <div class="progress-card">
                    <div class="progress-label">进步趋势</div>
                    <div class="progress-value trend" id="trendIndicator">-</div>
                </div>
            </div>
        </section>

        <section class="recommendations-section">
            <h2>💡 训练建议</h2>
            <div class="recommendations-list" id="recommendationsList">
                <p class="loading-text">加载中...</p>
            </div>
        </section>

        <section class="sessions-section">
            <h2>📋 历史记录</h2>
            <div class="sessions-actions">
                <button class="btn btn-secondary" id="exportBtn">导出数据</button>
                <select id="exportFormat">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                </select>
            </div>
            
            <div class="sessions-table-container">
                <table class="sessions-table" id="sessionsTable">
                    <thead>
                        <tr>
                            <th>训练ID</th>
                            <th>日期</th>
                            <th>投篮次数</th>
                            <th>姿势评分</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="sessionsTableBody">
                        <tr>
                            <td colspan="5" class="loading-text">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
            </div>
        </section>

        <!-- Session Detail Modal -->
        <div class="modal" id="sessionModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>训练详情</h3>
                    <button class="btn-icon modal-close" id="closeModal">✕</button>
                </div>
                <div class="modal-body" id="sessionDetail">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2024 篮球训练辅助系统</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
