<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - YOLOv8篮球训练辅助系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>🏀 YOLOv8篮球训练辅助系统</h1>
            <div class="user-info">
                <a href="/dashboard" class="nav-link">返回主页</a>
                <button id="logoutBtn" class="btn btn-secondary">退出登录</button>
            </div>
        </header>

        <!-- 个人资料编辑区 -->
        <div class="profile-section">
            <div class="profile-container">
                <!-- 头像区域 -->
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img id="avatarImg" src="/static/images/default-avatar.png" alt="头像" class="avatar">
                        <div class="avatar-overlay">
                            <span>更换头像</span>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                    </div>
                    <h2 id="displayName">加载中...</h2>
                    <p id="userRole" class="role-badge">学生</p>
                </div>

                <!-- 基本信息表单 -->
                <div class="form-section">
                    <h3>📝 基本信息</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" disabled class="disabled-input">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">姓名</label>
                                <input type="text" id="fullName" placeholder="请输入真实姓名">
                            </div>
                            <div class="form-group">
                                <label for="studentId">学生证号</label>
                                <input type="text" id="studentId" placeholder="请输入学生证号">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">年龄</label>
                                <input type="number" id="age" min="6" max="18" placeholder="6-18岁">
                            </div>
                            <div class="form-group">
                                <label for="phone">联系电话</label>
                                <input type="tel" id="phone" placeholder="请输入联系电话">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">电子邮箱</label>
                            <input type="email" id="email" placeholder="请输入邮箱地址">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </form>
                </div>

                <!-- 学校绑定区域 -->
                <div class="school-section">
                    <h3>🏫 学校绑定</h3>
                    <div id="schoolInfo" class="school-info">
                        <p class="not-bound">未绑定学校</p>
                    </div>
                    <div class="bind-form">
                        <div class="form-group">
                            <label for="schoolCode">学校代码</label>
                            <input type="text" id="schoolCode" placeholder="请输入学校代码（如：DEMO001）">
                        </div>
                        <div class="form-group" id="classSelectGroup" style="display:none;">
                            <label for="classSelect">选择班级</label>
                            <select id="classSelect">
                                <option value="">请选择班级</option>
                            </select>
                        </div>
                        <button type="button" id="bindSchoolBtn" class="btn btn-success">绑定学校</button>
                    </div>
                </div>

                <!-- 教师反馈区域（仅学生可见） -->
                <div class="feedback-section" id="feedbackSection">
                    <h3>💬 教师反馈</h3>
                    <div id="feedbackList" class="feedback-list">
                        <p class="no-feedback">暂无教师反馈</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/profile.js"></script>
</body>
</html>
