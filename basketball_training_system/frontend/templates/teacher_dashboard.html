<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理 - 篮球训练辅助系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🏀</span>
            <span class="brand-text">篮球训练辅助系统</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/teacher" class="nav-link active">学生管理</a>
            <a href="/analysis" class="nav-link">视频分析</a>
            <a href="/history" class="nav-link">训练记录</a>
            <a href="#" class="nav-link" id="logoutBtn">登出</a>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-header">
            <h1>👨‍🏫 教师管理中心</h1>
            <p class="subtitle">欢迎，<span id="teacherName">教师</span></p>
        </div>

        <!-- 统计概览 -->
        <section class="stats-overview">
            <div class="stat-card">
                <div class="stat-icon">👨‍🎓</div>
                <div class="stat-info">
                    <div class="stat-number" id="studentCount">0</div>
                    <div class="stat-label">学生总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-info">
                    <div class="stat-number" id="classCount">0</div>
                    <div class="stat-label">管理班级</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏀</div>
                <div class="stat-info">
                    <div class="stat-number" id="trainingCount">0</div>
                    <div class="stat-label">训练次数</div>
                </div>
            </div>
        </section>

        <!-- 学生列表 -->
        <section class="students-section">
            <div class="section-header">
                <h2>📋 学生列表</h2>
                <div class="filter-controls">
                    <select id="classFilter">
                        <option value="">所有班级</option>
                    </select>
                    <button class="btn btn-secondary" id="refreshBtn">刷新</button>
                </div>
            </div>
            
            <div class="students-table-container">
                <table class="data-table" id="studentsTable">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>用户名</th>
                            <th>年级</th>
                            <th>班级</th>
                            <th>训练次数</th>
                            <th>最后登录</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr>
                            <td colspan="7" class="loading-text">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 学生训练详情弹窗 -->
        <div class="modal" id="studentModal" style="display: none;">
            <div class="modal-content" style="max-width: 700px;">
                <div class="modal-header">
                    <h3>学生训练详情</h3>
                    <button class="btn-icon modal-close" id="closeModal">✕</button>
                </div>
                <div class="modal-body" id="studentDetail">
                </div>
                <div class="modal-footer" style="border-top: 1px solid #e9ecef; padding-top: 1rem; margin-top: 1rem;">
                    <h4>📝 给学生反馈</h4>
                    <form id="feedbackForm" style="margin-top: 0.5rem;">
                        <input type="hidden" id="feedbackStudentId">
                        <textarea id="feedbackContent" placeholder="输入训练建议和反馈..." 
                                  style="width: 100%; height: 80px; padding: 0.75rem; border: 1px solid #dee2e6; border-radius: 8px; resize: vertical;"></textarea>
                        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">发送反馈</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2024 篮球训练辅助系统 - 中小学生篮球训练平台</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // 检查登录状态和权限
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const result = await response.json();
                
                if (!result.authenticated) {
                    window.location.href = '/login';
                    return null;
                }
                
                if (result.user.role !== 'teacher') {
                    alert('只有教师可以访问此页面');
                    window.location.href = '/analysis';
                    return null;
                }
                
                return result.user;
            } catch (e) {
                window.location.href = '/login';
                return null;
            }
        }
        
        // 加载学生列表
        async function loadStudents(className = '') {
            const tableBody = document.getElementById('studentsTableBody');
            tableBody.innerHTML = '<tr><td colspan="7" class="loading-text">加载中...</td></tr>';
            
            try {
                let url = '/api/auth/students';
                if (className) {
                    url += `?class_name=${encodeURIComponent(className)}`;
                }
                
                const response = await fetch(url);
                const result = await response.json();
                
                if (!result.success) {
                    tableBody.innerHTML = `<tr><td colspan="7" class="loading-text">${result.error}</td></tr>`;
                    return;
                }
                
                const students = result.students;
                
                if (students.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="loading-text">暂无学生</td></tr>';
                    return;
                }
                
                // 更新统计
                document.getElementById('studentCount').textContent = students.length;
                
                // 收集班级
                const classes = new Set();
                students.forEach(s => {
                    if (s.class_name) classes.add(s.class_name);
                });
                document.getElementById('classCount').textContent = classes.size;
                
                // 计算训练次数
                let totalTraining = 0;
                students.forEach(s => {
                    totalTraining += (s.training_sessions || []).length;
                });
                document.getElementById('trainingCount').textContent = totalTraining;
                
                // 更新班级筛选下拉框
                const classFilter = document.getElementById('classFilter');
                classFilter.innerHTML = '<option value="">所有班级</option>';
                classes.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c;
                    option.textContent = c;
                    classFilter.appendChild(option);
                });
                
                // 渲染表格
                tableBody.innerHTML = students.map(student => `
                    <tr>
                        <td>${student.real_name || '-'}</td>
                        <td>${student.username}</td>
                        <td>${student.grade || '-'}</td>
                        <td>${student.class_name || '-'}</td>
                        <td>${(student.training_sessions || []).length}</td>
                        <td>${student.last_login ? new Date(student.last_login).toLocaleString('zh-CN') : '从未登录'}</td>
                        <td>
                            <button class="btn btn-secondary btn-small" onclick="viewStudent('${student.user_id}')">
                                查看详情
                            </button>
                        </td>
                    </tr>
                `).join('');
                
            } catch (e) {
                tableBody.innerHTML = '<tr><td colspan="7" class="loading-text">加载失败</td></tr>';
            }
        }
        
        // 查看学生详情
        async function viewStudent(studentId) {
            const modal = document.getElementById('studentModal');
            const detail = document.getElementById('studentDetail');
            
            detail.innerHTML = '<p>加载中...</p>';
            modal.style.display = 'flex';
            document.getElementById('feedbackStudentId').value = studentId;
            
            try {
                // 获取学生训练数据
                const response = await fetch(`/api/teacher/student/${studentId}/sessions`);
                const result = await response.json();
                
                if (result.success) {
                    const student = result.student;
                    const sessions = result.sessions || [];
                    
                    let html = `
                        <div style="background: #f8f9fa; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                            <h4 style="margin: 0 0 0.5rem 0;">👨‍🎓 ${student.real_name || student.username}</h4>
                            <p style="margin: 0; color: #6c757d;">
                                ${student.school || '未设置学校'} | ${student.grade || ''} ${student.class_name || ''} | 学号: ${student.student_id || '未设置'}
                            </p>
                        </div>
                        <h4>📊 训练统计</h4>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem;">
                            <div style="background: #e8f4fd; padding: 1rem; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${sessions.length}</div>
                                <div style="color: #6c757d;">训练次数</div>
                            </div>
                            <div style="background: #d4edda; padding: 1rem; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #28a745;">${result.avg_score ? (result.avg_score * 100).toFixed(0) + '%' : '--'}</div>
                                <div style="color: #6c757d;">平均评分</div>
                            </div>
                            <div style="background: #fff3cd; padding: 1rem; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #856404;">${result.total_shots || 0}</div>
                                <div style="color: #6c757d;">总投篮数</div>
                            </div>
                        </div>
                    `;
                    
                    if (sessions.length > 0) {
                        html += `<h4>📅 最近训练记录</h4><div style="max-height: 200px; overflow-y: auto;">`;
                        sessions.slice(0, 10).forEach(session => {
                            html += `
                                <div style="display: flex; justify-content: space-between; padding: 0.75rem; border-bottom: 1px solid #e9ecef;">
                                    <span>${new Date(session.date).toLocaleString('zh-CN')}</span>
                                    <span>投篮 ${session.total_shots} 次，评分 ${(session.form_quality_score * 100).toFixed(0)}%</span>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    } else {
                        html += `<p style="color: #6c757d;">该学生暂无训练记录</p>`;
                    }
                    
                    detail.innerHTML = html;
                } else {
                    detail.innerHTML = `<p style="color: #dc3545;">${result.error || '加载失败'}</p>`;
                }
            } catch (e) {
                detail.innerHTML = `<p style="color: #dc3545;">加载失败: ${e.message}</p>`;
            }
        }
        
        // 发送反馈
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentId = document.getElementById('feedbackStudentId').value;
            const content = document.getElementById('feedbackContent').value.trim();
            
            if (!content) {
                alert('请输入反馈内容');
                return;
            }
            
            try {
                const response = await fetch(`/api/teacher/student/${studentId}/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('反馈已发送！');
                    document.getElementById('feedbackContent').value = '';
                    document.getElementById('studentModal').style.display = 'none';
                } else {
                    alert(result.error || '发送失败');
                }
            } catch (e) {
                alert('发送失败: ' + e.message);
            }
        });
        
        // 登出
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {}
            
            localStorage.removeItem('session_id');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
        
        // 初始化
        (async () => {
            const user = await checkAuth();
            if (!user) return;
            
            document.getElementById('teacherName').textContent = user.real_name || user.username;
            
            await loadStudents();
            
            // 班级筛选
            document.getElementById('classFilter').addEventListener('change', (e) => {
                loadStudents(e.target.value);
            });
            
            // 刷新按钮
            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadStudents(document.getElementById('classFilter').value);
            });
            
            // 登出按钮
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                logout();
            });
            
            // 关闭弹窗
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('studentModal').style.display = 'none';
            });
            
            document.getElementById('studentModal').addEventListener('click', (e) => {
                if (e.target.id === 'studentModal') {
                    document.getElementById('studentModal').style.display = 'none';
                }
            });
        })();
    </script>
</body>
</html>
